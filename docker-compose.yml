services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Data Source=/app/App_Data/pantry.db
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env before starting}
    volumes:
      - pantry-data:/app/App_Data
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NODE_ENV: production
    expose:
      - "3000"
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    depends_on:
      - api
      - frontend
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pantry-data:
    name: pantry-data
